<!doctype html>
<html lang="en" data-theme="light">
<head><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="ba-row" style="align-items:center">
  <button class="ba-btn ba-btn-primary" type="button">Lay it</button>
  <button class="ba-btn ba-btn-secondary" type="button">Lay alone <span class="ba-cost">· draw 2</span></button>
  <button class="ba-btn ba-btn-secondary" type="button">Draw and pass</button>
  <button class="ba-btn ba-btn-stuck" type="button" aria-pressed="false">Stuck</button>
  <button class="ba-btn ba-btn-stuck" type="button" aria-pressed="true">Stuck</button>
</div>
<div class="ba-row" style="align-items:center; padding-top:0">
  <button class="ba-btn ba-btn-secondary" type="button" disabled>Lay alone</button>
  <button class="ba-btn ba-btn-primary is-disabled" type="button"><span class="ba-ring" style="--left:55%"></span>Wait 2s</button>
  <button class="ba-btn ba-btn-quiet" type="button">Rules</button>
  <div class="ba-seg" role="group" aria-label="Mode"><button type="button" aria-pressed="false">Race</button><button type="button" aria-pressed="true">Turns</button></div>
</div>
</body>
</html>
