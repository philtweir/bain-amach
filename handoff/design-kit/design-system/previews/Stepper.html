<!doctype html>
<html lang="ga" data-theme="light">
<head><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>Stepper — preview</title>
<style>
  .row { display: flex; gap: 14px; align-items: center; padding: 10px 16px; flex-wrap: wrap; }
  .line { display: flex; align-items: center; gap: 12px; width: 340px; padding: 4px; border-radius: 14px; background: var(--surface); }
  .line span { flex: 1; font: 400 13px/17px var(--font-ui); color: var(--ink-muted); }
</style></head>
<body>
<div class="row">
  <div class="line"><div class="ba-card ba-table ba-verb" style="--s: 44px; --fs: 13px; --r: 8px"><span class="ba-word">cuir</span></div><span></span><div class="ba-stepper" role="group" aria-label="cuir"><button class="ba-dec" type="button" aria-label="One fewer cuir"></button><output>6</output><button class="ba-inc" type="button" aria-label="One more cuir"></button></div></div>
</div>
<div class="row">
  <div class="line"><div class="ba-card ba-table ba-verb" style="--s: 44px; --fs: 13px; --r: 8px"><span class="ba-word">fág</span></div><span>Standard 2 · at 0, − is disabled</span><div class="ba-stepper" role="group" aria-label="fág"><button class="ba-dec" type="button" aria-label="One fewer fág" disabled></button><output>0</output><button class="ba-inc" type="button" aria-label="One more fág"></button></div></div>
</div>
</body>
