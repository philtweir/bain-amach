<!doctype html>
<html lang="en" data-theme="light">
<head><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>Toast — preview</title></head>
<body>
<div class="ba-row" style="flex-direction:column; align-items:flex-start">
  <div class="ba-toast ba-p1" role="status"><span class="ba-dot"></span><div><div class="ba-ga">cuir suas le</div><div class="ba-en">put up with · Siobhán</div></div></div>
  <div class="ba-toast ba-toast-soft" role="status"><span class="ba-ico ba-ico-retry"></span><div><div class="ba-msg">Not quite: <i>cuir</i> doesn’t take <i>faoi</i></div><div class="ba-en">Turn over. You draw 1.</div></div></div>
  <div class="ba-toast ba-toast-soft" role="status"><span class="ba-ico ba-ico-retry"></span><div><div class="ba-msg">Not quite: <i>cuir suas le</i> isn’t on this card</div><div class="ba-en">Try again in 3 seconds</div></div></div>
  <div class="ba-toast ba-toast-alert" role="alert"><span class="ba-ico ba-ico-no"></span><span class="ba-msg">Couldn’t save the game. Your progress is kept until you close the app.</span></div>
  <div class="ba-toast ba-toast-quiet" role="status"><span class="ba-ico ba-ico-taken"></span><div><div class="ba-msg" style="font:700 15px/20px var(--font-ui)">Taken</div><div class="ba-en">Bot B got there first</div></div></div>
</div>
</body>
</html>
