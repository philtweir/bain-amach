<!doctype html>
<html lang="ga" data-theme="light">
<head><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>Card — preview</title>
<style>
  .grid { display: grid; grid-template-columns: 92px repeat(5, auto); gap: 16px 20px; align-items: center; padding: 16px; justify-content: start; }
  .h { font: 700 11px/14px var(--font-ui); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-muted); }
  .states { display: flex; gap: 18px; align-items: flex-end; padding: 8px 16px 20px; flex-wrap: wrap; }
</style></head>
<body>
<div class="grid">
  <span></span><span class="h">Verb</span><span class="h">Adverb</span><span class="h">Preposition</span><span class="h">Wildcard</span><span class="h">Vertical line</span>
  <span class="h">Hand 76</span>
  <div class="ba-card ba-verb"><span class="ba-word ba-l">éirigh</span></div>
  <div class="ba-card ba-adverb"><span class="ba-word">síos</span></div>
  <div class="ba-card ba-preposition"><span class="ba-word">ó</span></div>
  <div class="ba-card ba-wild"><span class="ba-star"></span></div>
  <div class="ba-card ba-adverb ba-v"><span class="ba-word ba-l">amach</span></div>
  <span class="h">River 60</span>
  <div class="ba-card ba-river ba-verb"><span class="ba-word">fág</span></div>
  <div class="ba-card ba-river ba-adverb"><span class="ba-word ba-xl">isteach</span></div>
  <div class="ba-card ba-river ba-preposition"><span class="ba-word">faoi</span></div>
  <div class="ba-card ba-river ba-wild"><span class="ba-star"></span></div>
  <div class="ba-card ba-river ba-preposition ba-v"><span class="ba-word">le</span></div>
  <span class="h">Table 64</span>
  <div class="ba-card ba-table ba-verb"><span class="ba-word ba-xl">tabhair</span><i class="ba-own ba-p1"></i></div>
  <div class="ba-card ba-table ba-adverb"><span class="ba-word">suas</span><i class="ba-own ba-p2"></i></div>
  <div class="ba-card ba-table ba-preposition"><span class="ba-word">ar</span><i class="ba-cross"></i></div>
  <div class="ba-card ba-table ba-wild"><span class="ba-stands">as</span></div>
  <div class="ba-card ba-table ba-adverb ba-v"><span class="ba-word">síos</span></div>
</div>
<div class="states">
  <div class="ba-col"><div class="ba-card ba-verb"><span class="ba-word">cuir</span></div><span class="ba-note">Rest</span></div>
  <div class="ba-col"><div class="ba-card ba-table ba-adverb is-fresh"><span class="ba-word">síos</span></div><span class="ba-note">Just laid</span></div>
  <div class="ba-col"><div class="ba-card ba-verb is-selected"><span class="ba-word">cuir</span></div><span class="ba-note">Selected</span></div>
  <div class="ba-col"><div class="ba-card ba-river ba-adverb is-lit"><span class="ba-word">suas</span></div><span class="ba-note">Lit target</span></div>
  <div class="ba-col"><div class="ba-card ba-river ba-adverb is-dim"><span class="ba-word ba-l">amach</span></div><span class="ba-note">Not usable</span></div>
  <div class="ba-col"><div class="ba-card ba-preposition" tabindex="0" style="box-shadow: var(--rest), 0 0 0 2.5px var(--table), 0 0 0 5px var(--focus)"><span class="ba-word">do</span></div><span class="ba-note">Keyboard focus</span></div>
</div>
</body>
</html>
