<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recap</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bainamach/tokens.css">
<link rel="stylesheet" href="ds/bainamach/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ba-felt" style="position: relative; width: {{w}}px; height: {{h}}px; overflow: hidden; background: var(--table); color: var(--ink); font-family: var(--font-ui); display: flex; flex-direction: column">
  <div style="height: {{topInset}}px; flex: none"></div>
  <div style="display: flex; align-items: center; padding: 4px 16px 0 6px">
    <button class="ba-icon-btn" type="button" aria-label="Home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div style="flex: 1"></div>
    <sc-if value="{{hints}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 700; font-size: 13px; color: var(--ink-muted)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg>Hints used</span></sc-if>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap; gap: 24px {{colGap}}px; padding: 4px {{pad}}px 0; align-content: flex-start; overflow: hidden">
    <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="font-weight: 700; font-size: 12px; line-height: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted)">{{eyebrow}}</div>
      <div style="font-family: var(--font-card); font-weight: 800; font-size: 44px; line-height: 44px; letter-spacing: -0.02em">{{headline}}</div>
      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
        <sc-for list="{{standings}}" as="r" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 14px; background: var(--surface)">
            <span class="{{r.cls}}" style="width: 32px; height: 32px; border-radius: 50%; background: var(--pat), var(--p); color: var(--on-player); display: grid; place-items: center; font-family: var(--font-card); font-weight: 800; font-size: 14px">{{r.init}}</span>
            <span style="flex: 1; font-weight: 700; font-size: 15px">{{r.name}}</span>
            <span style="font-size: 14px; color: var(--ink-muted); font-variant-numeric: tabular-nums">{{r.cards}}</span>
            <span style="font-size: 14px; color: var(--ink-muted); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right">{{r.lines}}</span>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{tab}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; gap: 10px; margin-top: 12px">
          <button class="ba-btn ba-btn-primary" type="button" style="flex: 1">Play again</button>
          <button class="ba-btn ba-btn-secondary" type="button" style="flex: 1">Replay this game</button>
        </div>
      </sc-if>
    </div>

    <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px">
        <div style="flex: 1; font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted)">Compounds made</div>
        <div style="font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums">{{madeCount}} in play order</div>
      </div>
      <sc-for list="{{madeShown}}" as="c" hint-placeholder-count="5">
        <a href="Glossary.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 8px 4px 12px; border-radius: 12px; background: var(--surface-raised); color: var(--ink); text-decoration: none">
          <span class="{{c.cls}}" style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--pat), var(--p)" aria-label="{{c.who}}"></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-family: var(--font-card); font-weight: 800; font-size: 16px; line-height: 20px">{{c.ga}}</span><span style="font-size: 13px; line-height: 17px; color: var(--ink-muted)">{{c.en}} · {{c.who}}</span></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink-muted)"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </sc-for>
      <sc-if value="{{more}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; line-height: 18px; color: var(--ink-muted); padding: 2px 12px">{{more}}</div></sc-if>
      <div style="font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); margin-top: 10px">Lines you could have made</div>
      <sc-for list="{{missed}}" as="c" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 12px; border-radius: 12px; border: 1.5px dashed var(--line)">
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-family: var(--font-card); font-weight: 800; font-size: 15px; line-height: 19px">{{c.ga}}</span><span style="font-size: 13px; line-height: 17px; color: var(--ink-muted)">{{c.en}} · {{c.when}}</span></span>
        </div>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{phone}}" hint-placeholder-val="{{true}}">
    <div class="ba-tray" style="flex: none; padding: 12px 16px 34px; display: flex; gap: 10px">
      <button class="ba-btn ba-btn-secondary" type="button" style="flex: 1">Replay game</button>
      <button class="ba-btn ba-btn-primary" type="button" style="flex: 1">Play again</button>
    </div>
  </sc-if>
  <sc-if value="{{tab}}" hint-placeholder-val="{{false}}"><div style="height: 24px; flex: none"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["fewest","out"],"default":"fewest"},"device":{"editor":"enum","options":["phone","tablet"],"default":"phone"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const v = this.props.variant ?? 'fewest';
  const tab = (this.props.device ?? 'phone') === 'tablet';
  const out = v === 'out';
  const P = (p, init, name) => ({ p, init, name });
  const players = out ? [P('p1', 'S', 'Siobhán'), P('p2', 'C', 'Ciarán'), P('p3', 'É', 'Éabha')] : [P('p1', 'Y', 'You'), P('p2', 'B', 'Bot B')];
  const standings = (out
    ? [[0, '0 cards', '6 lines'], [1, '3 cards', '5 lines'], [2, '5 cards', '4 lines']]
    : [[0, '2 cards', '5 lines'], [1, '4 cards', '4 lines']]
  ).map(([i, cards, lines]) => ({ cls: 'ba-' + players[i].p, init: players[i].init, name: players[i].name, cards, lines }));
  const made = [
    ['cuir suas le', 'put up with', 1], ['bain amach', 'achieve', 0], ['éist le', 'listen to', 0], ['tabhair suas', 'give up', 1],
    ['cuir síos ar', 'describe', 0], ['éirigh as', 'give up', 1], ['fan amach ó', 'stay away from', out ? 2 : 0],
  ].map(([ga, en, who]) => ({ ga, en, cls: 'ba-' + players[who].p, who: players[who].name }));
  return {
    w: tab ? 1180 : 390, h: tab ? 820 : 844, topInset: tab ? 24 : 47, pad: tab ? 40 : 16, colGap: tab ? 56 : 24,
    tab, phone: !tab, hints: out,
    eyebrow: out ? 'Siobhán went out' : 'No more plays · fewest cards',
    headline: out ? 'Siobhán wins' : 'You win',
    standings, madeShown: tab ? made : made.slice(0, 4), more: tab ? '' : (made.length - 4) + ' more as you scroll', madeCount: made.length,
    missed: [{ ga: 'cuir isteach ar', en: 'interfere with', when: 'your wildcard and ar were free on turn 6' }, { ga: 'bain as', en: 'get from', when: 'as was on top on turn 9' }],
  };
}
}
</script>
</body>
</html>
