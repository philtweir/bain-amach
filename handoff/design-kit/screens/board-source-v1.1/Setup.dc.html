<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game setup</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bainamach/tokens.css">
<link rel="stylesheet" href="ds/bainamach/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ba-felt" style="position: relative; width: {{w}}px; height: {{h}}px; overflow: hidden; background: var(--table); color: var(--ink); font-family: var(--font-ui); display: flex; flex-direction: column">
  <div style="height: {{topInset}}px; flex: none"></div>
  <div style="display: flex; align-items: center; gap: 4px; padding: 4px 16px 4px 6px">
    <button class="ba-icon-btn" type="button" aria-label="Back to Home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="font-family: var(--font-card); font-weight: 800; font-size: 24px; line-height: 28px">New game</div>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 20px {{colGap}}px; padding: 8px {{pad}}px 12px; align-content: flex-start">
    <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted)">Players</div>
        <div class="ba-seg" role="group" aria-label="Players"><button type="button" aria-pressed="{{solo}}">Solo</button><button type="button" aria-pressed="{{pass}}">Pass-and-play</button></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted)">Mode</div>
        <div class="ba-seg" role="group" aria-label="Mode"><button type="button" aria-pressed="false" disabled="{{pass}}">Race</button><button type="button" aria-pressed="true">Turns</button></div>
        <div style="font-size: 13px; line-height: 18px; color: var(--ink-muted)">{{modeNote}}</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted)">Answers on meaning cards</div>
        <div class="ba-seg" role="group" aria-label="Answers"><button type="button" aria-pressed="true">Shown</button><button type="button" aria-pressed="false">Hidden</button></div>
        <div style="font-size: 13px; line-height: 18px; color: var(--ink-muted)">Hidden turns off line highlighting too. A wrong line costs your turn.</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted)">Hints</div>
        <div class="ba-seg" role="group" aria-label="Hints"><button type="button" aria-pressed="false">Off</button><button type="button" aria-pressed="true">On request</button><button type="button" aria-pressed="false">After 20s</button></div>
      </div>
      <sc-if value="{{sfShow}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 8px"><span class="ba-card ba-sf" style="--s: 22px; --rim: 1.5px; --fs: 0px; --r: 5px" aria-hidden="true"></span><span style="font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted)">Stórfhocal</span></div>
          <div class="ba-seg" role="group" aria-label="Stórfhocal"><button type="button" aria-pressed="{{sfOff}}">Off</button><button type="button" aria-pressed="{{sfOn}}">On</button></div>
          <div style="font-size: 13px; line-height: 18px; color: var(--ink-muted)">{{sfNote}}</div>
        </div>
      </sc-if>
    </div>

    <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
      <sc-if value="{{deckRow}}" hint-placeholder-val="{{false}}">
        <div style="font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted)">Deck</div>
        <button type="button" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 12px 6px 10px; border: 0; border-radius: 14px; background: var(--surface); color: var(--ink); text-align: left; font: inherit; cursor: pointer; margin-bottom: 8px">
          <span style="position: relative; width: 30px; height: 36px; flex: none" aria-hidden="true"><span style="position: absolute; left: 3px; top: 0; width: 26px; height: 32px; border-radius: 6px; background: var(--card-back); opacity: 0.55"></span><span style="position: absolute; left: 0; top: 3px; width: 26px; height: 32px; border-radius: 6px; background: var(--card-back)"></span></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px; line-height: 19px">{{deckName}}</span><span style="font-size: 13px; line-height: 17px; color: var(--ink-muted)">{{deckMeta}}</span></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink-muted)"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </sc-if>
      <div style="font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted)">{{peopleLabel}}</div>
      <sc-for list="{{people}}" as="p" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 14px; background: var(--surface)">
          <span class="{{p.cls}}" style="position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--pat), var(--p); color: var(--on-player); display: grid; place-items: center; font-family: var(--font-card); font-weight: 800; font-size: 15px"><sc-if value="{{p.hasChar}}" hint-placeholder-val="{{false}}"><img src="{{p.img}}" alt="" style="position: absolute; left: -5px; bottom: -3px; width: 44px; height: 44px"></sc-if><sc-if value="{{p.noChar}}" hint-placeholder-val="{{true}}">{{p.init}}</sc-if></span>
          <sc-if value="{{p.human}}" hint-placeholder-val="{{false}}">
            <label for="{{p.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Player name</label>
            <input id="{{p.id}}" value="{{p.name}}" style="flex: 1; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-raised); color: var(--ink); font: 700 15px var(--font-ui)">
          </sc-if>
          <sc-if value="{{p.bot}}" hint-placeholder-val="{{true}}">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px; line-height: 19px">{{p.name}}</span><sc-if value="{{p.sub}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 16px; color: var(--ink-muted)">{{p.sub}}</span></sc-if></span>
            <div class="ba-seg" role="group" aria-label="Difficulty" style="padding: 2px"><button type="button" aria-pressed="{{p.easy}}" style="min-height: 36px; padding: 0 9px; font-size: 13px">Easy</button><button type="button" aria-pressed="{{p.normal}}" style="min-height: 36px; padding: 0 9px; font-size: 13px">Normal</button><button type="button" aria-pressed="{{p.hard}}" style="min-height: 36px; padding: 0 9px; font-size: 13px">Hard</button></div>
          </sc-if>
          <button class="ba-icon-btn" type="button" aria-label="Remove {{p.name}}" disabled="{{p.fixed}}" style="width: 36px; height: 36px; opacity: {{p.rmOp}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </sc-for>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{adds}}" as="a" hint-placeholder-count="1"><button class="ba-btn ba-btn-secondary" type="button" style="min-height: 44px; font-size: 14px">+ {{a}}</button></sc-for>
      </div>
    </div>
  </div>
  <div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px {{colGap}}px; padding: 10px {{pad}}px 0; box-shadow: 0 -1px 0 var(--line)">
    <div style="flex: 1 1 340px; min-width: 0; display: flex; align-items: center; gap: 10px; font-size: 13px; line-height: 18px; color: var(--ink-muted)">
      <span class="ba-card ba-river" style="--s: 28px; --glyph: 0px; background: var(--card-back); --edge: var(--card-back)" aria-hidden="true"></span>
      <span>{{deckNote}}</span>
    </div>
    <button class="ba-btn ba-btn-primary" type="button" style="flex: 1 1 340px; max-width: 560px; min-height: 52px; font-size: 17px">Play</button>
  </div>
  <div style="height: {{bottomInset}}px; flex: none"></div>

  <sc-if value="{{picker}}" hint-placeholder-val="{{false}}">
    <div class="ba-scrim" style="position: absolute; inset: 0; z-index: 5"></div>
    <div class="ba-sheet" role="dialog" aria-label="Choose a deck" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 10px 16px 34px; display: flex; flex-direction: column; gap: 10px">
      <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--line)"></div>
      <div style="font-family: var(--font-card); font-weight: 800; font-size: 26px; line-height: 30px; margin-top: 4px">Deck</div>
      <div role="radiogroup" aria-label="Deck" style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{deckOpts}}" as="d" hint-placeholder-count="3">
          <div role="radio" aria-checked="{{d.on}}" aria-disabled="{{d.off}}" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px; border-radius: 14px; background: var(--surface); box-shadow: {{d.ring}}; opacity: {{d.op}}">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 16px; line-height: 20px">{{d.name}}</span><span style="font-size: 13px; line-height: 17px; color: var(--ink-muted)">{{d.meta}}</span></span>
            <span style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; {{d.dot}}"></span>
          </div>
        </sc-for>
      </div>
      <a class="ba-btn ba-btn-quiet" href="Decks.dc.html" style="text-decoration: none; align-self: flex-start; padding: 0 2px">Edit decks</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["solo","pass"],"default":"solo"},"device":{"editor":"enum","options":["phone","tablet"],"default":"phone"},"characters":{"editor":"enum","options":["off","on"],"default":"off"},"storfhocal":{"editor":"enum","options":["hidden","off","on","nohard"],"default":"hidden"},"deck":{"editor":"enum","options":["off","row","picker"],"default":"off"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const v = this.props.variant ?? 'solo';
  const tab = (this.props.device ?? 'phone') === 'tablet';
  const pass = v === 'pass';
  const people = pass
    ? [
        { cls: 'ba-p1', init: 'S', name: 'Siobhán', human: true, id: 'name-1', fixed: true },
        { cls: 'ba-p2', init: 'C', name: 'Ciarán', human: true, id: 'name-2', fixed: true },
        { cls: 'ba-p3', init: 'É', name: 'Éabha', human: true, id: 'name-3' },
      ]
    : [
        { cls: 'ba-p2', init: 'B', name: 'Bot B', bot: true, easy: true, normal: false, hard: false, fixed: true },
      ];
  // characters (proposal): the difficulty picks the species, so changing it swaps the face
  const CH = (this.props.characters ?? 'off') === 'on';
  const FACE = { easy: ['Broc', '/_blob/8fbe9b9eae48d0041a6ec139b8eeac6f', 'Badger'], normal: ['Corr', '/_blob/9c80630b4606e85a6789d7762a91633f', 'Heron'], hard: ['Giorria', '/_blob/bec0829941d8ddded704549d0755fe53', 'Hare'] };
  if (CH && !pass) {
    people.length = 0;
    [['ba-p2', 'easy', true], ['ba-p3', 'hard', false]].forEach(([cls, d, fixed]) => people.push({ cls, init: '', bot: true, easy: d === 'easy', normal: d === 'normal', hard: d === 'hard', fixed, name: FACE[d][0], img: FACE[d][1], sub: FACE[d][2], hasChar: true }));
  }
  people.forEach((p) => { p.rmOp = p.fixed ? 0.3 : 1; p.bot = !!p.bot; p.human = !!p.human; p.hasChar = !!p.hasChar; p.noChar = !p.hasChar; p.img = p.img || ''; p.sub = p.sub || ''; });
  const n = pass ? 3 : people.length + 1;
  // Stórfhocal (proposal): appears after 20 finished games; never in pass-and-play
  const sf = this.props.storfhocal ?? 'hidden';
  const sfShow = sf !== 'hidden' && !pass;
  const sfNote = sf === 'nohard' ? 'Bots lay Stórfhocail only at Hard. You can still play tiles from your bag (4).'
    : 'Lay a tile from your bag (4) and Hard bots are far more likely to lay one back. The winner keeps every tile laid.';
  return {
    w: tab ? 1180 : 390, h: tab ? 820 : 844, topInset: tab ? 24 : 47, bottomInset: tab ? 24 : 34,
    pad: tab ? 40 : 16, colGap: tab ? 56 : 20,
    deckRow: (this.props.deck ?? 'off') !== 'off', picker: (this.props.deck ?? 'off') === 'picker',
    deckName: 'Standard', deckMeta: n >= 3 ? '118 cards with the verb pack · change' : '104 cards · change',
    deckOpts: [
      ['Standard', '104 cards for 2 players, 118 for 3 or 4', true, false],
      ['Ceachtanna 1', 'Serves 2 players only. Remove a bot to use it.', false, n >= 3],
      ['Na briathra móra', '112 cards · 2 to 4 players', false, false],
    ].map(([name, meta, on, off]) => ({ name, meta, on, off, op: off ? 0.55 : 1, ring: on ? 'inset 0 0 0 2.5px var(--ink)' : 'none', dot: on ? 'background: var(--ink); box-shadow: inset 0 0 0 5px var(--surface), 0 0 0 2px var(--ink)' : 'box-shadow: inset 0 0 0 2px var(--line)' })),
    solo: !pass, pass, sfShow, sfOn: sf === 'on' || sf === 'nohard', sfOff: sf === 'off', sfNote,
    modeNote: pass ? 'Race needs a screen for each player. It comes with online play.' : 'Turns: one play each, at your own pace.',
    peopleLabel: pass ? 'Players' : 'Opponents',
    people, adds: pass ? ['Player', 'Bot'] : n >= 4 ? [] : ['Bot'],
    deckNote: n >= 4 ? 'Deck: 118 cards, with the 14-card verb pack. Hands of 10.' : n >= 3 ? 'Deck: 118 cards, with the 14-card verb pack for 3 or 4 players.' : 'Deck: 104 cards for 2 players. Hands of 12.',
  };
}
}
</script>
</body>
</html>
