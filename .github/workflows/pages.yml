name: Deploy to GitHub Pages

# One Pages site, two channels:
#   /bain-amach/        the release: the newest vX.Y.Z tag
#   /bain-amach/main/   the test build: the tip of main, stamped IN TEST
# Pages serves one upload at a time, so every run rebuilds both. A push to main updates the test
# build; pushing a tag updates the release and creates its GitHub Release. Either leaves the site whole.
#
# To release:  git tag v1.2.0 && git push origin v1.2.0
# Pre-release tags (v1.2.0-rc.1) get a GitHub pre-release but never replace the release on the site.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # the GitHub Release on a tag
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one but never cancels one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # tags, to find the newest release

      - id: refs
        name: Find the newest release
        run: |
          release=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"
          if [ -z "$release" ]; then
            echo "::warning::No vX.Y.Z tag yet, so the release slot gets a build of main. Tag a release to fix that."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      # ---------- the test build: main ----------
      - run: npm ci

      - name: Unit tests (main)
        run: npx vitest run --project unit

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # End-to-end tests run against a production build of main at the Pages subpath, so the service
      # worker, offline mode and asset URLs are checked as deployed. Release channel: the tests seed
      # storage under the release's keys (the test build prefixes them with ba-main:).
      - name: End-to-end tests (main)
        run: npm run e2e
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          APP_CHANNEL: release

      - name: Build main
        run: npx tsc --noEmit && npx vite build --outDir dist-main
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/main/
          APP_CHANNEL: main
          APP_COMMIT: ${{ steps.refs.outputs.commit }}
          APP_BUILT: ${{ steps.refs.outputs.built }}
          APP_RELEASE: ${{ steps.refs.outputs.release }}

      # ---------- the release: the newest tag ----------
      - name: Check out ${{ steps.refs.outputs.release }}
        if: steps.refs.outputs.release != ''
        run: |
          git worktree add ../release "${{ steps.refs.outputs.release }}"
          # A release from before channels would claim /main/ for itself (see vite.config.ts).
          grep -q navigateFallbackDenylist ../release/vite.config.ts || {
            echo "::error::${{ steps.refs.outputs.release }} predates the release/test channels. Tag a commit that has them."
            exit 1
          }

      - name: Unit tests (${{ steps.refs.outputs.release }})
        # Only when this run is that tag's own push; otherwise it was tested when it was tagged.
        if: steps.refs.outputs.release != '' && github.ref == format('refs/tags/{0}', steps.refs.outputs.release)
        working-directory: ../release
        run: npm ci && npx vitest run --project unit

      - name: Build ${{ steps.refs.outputs.release || 'main as the release' }}
        run: |
          dir=../release; [ -d "$dir" ] || dir=.
          cd "$dir"
          [ -d node_modules ] || npm ci
          npx tsc --noEmit && npx vite build --outDir "$GITHUB_WORKSPACE/dist-release" --emptyOutDir
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          APP_CHANNEL: release
          APP_VERSION: ${{ steps.refs.outputs.release }}
          APP_COMMIT: ${{ steps.refs.outputs.commit }}

      - name: Put the two together
        run: |
          mkdir site
          cp -r dist-release/. site/
          mkdir site/main
          cp -r dist-main/. site/main/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Release for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $pre
