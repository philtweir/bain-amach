name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/gifted-bell-4sxvja]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one but never cancels one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Unit tests
        run: npx vitest run --project unit

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # End-to-end tests run against the production build at the Pages subpath, so the
      # service worker, offline mode and asset URLs are checked exactly as deployed.
      - name: End-to-end tests
        run: npm run e2e
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
